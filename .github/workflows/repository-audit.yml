name: Repository Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Display Python version
        run: python3 --version

      - name: Compile audit script
        run: python3 -m py_compile .github/scripts/repository_audit.py

      - name: Run repository audit
        run: python3 .github/scripts/repository_audit.py

  secret-history-scan:
    name: Gitleaks full history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm available Git history
        run: |
          echo "Commits available to the runner:"
          git rev-list --all --count
          echo "Branches and tags available:"
          git show-ref

      - name: Scan complete Git history
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git \
            --redact \
            --verbose \
            --log-opts="--all" \
            /repo
